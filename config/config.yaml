index_dir: DATA
nppes_dir: raw/nppes
ptd_dir: raw/ptd
reference_dir: reference
output_dir: outputs
workers: 4
duckdb:
  memory_limit: 2GB
  threads: null
recon:
  sample_size: 20
  probe_mb: 40
  probe_url_pattern: healthnet-ca_in-network
c2:
  # scope (Section 3 of the brief); several states may be listed
  target_states: [CA]
  target_market: group
  target_network: PPO
  eoa_as: eoa
  ppo_epo_as: ppo
  organizer_confirmed: [eoa_as, ppo_epo_as]
  hsp_as: unknown
  glued_prefixes: [CUS]
  family_candidates: [WholeCare, SmartCare, Full Network, Salud, SAL, CalChoice, SC, EC, CommunityCare, Trio, PureCare, EnhancedCare, Elect, Select, Open Access, Mex]
  family_min_support: 5
  family_min_purity: 1.0
  costshare_min_support: 20
  costshare_min_precision: 0.95
  brand_state_min_share: 0.9
  entity_rules:
    - {pattern: "Life Insurance", implies: PPO}
    - {pattern: "Health Net of California", implies: HMO}
  fingerprint:
    cap_mb: 40
    max_groups: 200000
