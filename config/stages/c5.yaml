c5:
  target_state: CA
  sources_dir: raw/sources
  min_agreeing_sources: 2
  nppes_stale_years: 3
  recency_factors:
    fresh_years: 1
    fresh: 1.0
    recent: 0.7
    stale: 0.4
  source_weights:
    ca_facility: 0.8
    dac: 0.7
    ca_facility_name_zip: 0.6
    dac_group: 0.6
    cms_clia: 0.5
    nppes_primary: 0.5
    nppes_secondary: 0.4
    irs_eo: 0.4
  source_family:
    ca_facility: ca_cdph
    ca_facility_name_zip: ca_cdph
    dac_group: cms_dac
    cms_clia: cms_clia
    dac: cms_dac
    nppes_primary: nppes
    nppes_secondary: nppes
    irs_eo: irs
  high_trust_sources: [ca_facility]
  # found by a name + ZIP search (ZIP taken from NPPES), so agreement with NPPES counts as "corroborated", not "verified"
  name_linked_sources: [ca_facility_name_zip, dac_group, cms_clia]
  # every source is required; set true to run without a missing one (it is then listed in c5_stats.json -> missing_sources)
  allow_missing_sources: false
  geocode:
    enabled: true
    benchmark: Public_AR_Current
    vintage: Current_Current
    batch_size: 2500
    workers: 4
    timeout_s: 600
    retries: 3
  directory_check:
    path: reference/directory_check_sample.csv
    per_stratum: 25
    seed: 7
  name_match_threshold: 0.5
  facility_name_match_threshold: 0.6
reference_data:
  fallback_states: [CA, NV, OR, AZ]
